# .github/workflows/build.yml
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # 手動実行
  workflow_call: {}  # release.yml の gate job から関門として呼ぶ（入力なし）

jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-pc-windows-msvc
            arch: x86
          - target: x86_64-pc-windows-msvc
            arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set Japanese locale for Shift-JIS support
        run: |
          Set-WinSystemLocale ja-JP
          Set-Culture ja-JP
        shell: powershell

      - name: Build pasta_shiori
        run: cargo build --release --target ${{ matrix.target }} -p pasta_shiori

      - name: Run tests
        run: cargo test --all --target ${{ matrix.target }}

      # 長いパスの設定（LongPathsEnabled）を切った機械で、深いパスの DLL と隣の依存 DLL が読めるかを確かめる
      # （lua-cmodule-robustness 要件 2.5）。ランナーは使い捨てなので元に戻さない。
      # テストは最初に接頭辞なしの長いパスが通らないことを確かめ、設定が効いていなければ失敗する。
      - name: Run FFI tests with LongPathsEnabled=0
        run: |
          Set-ItemProperty -Path HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 0
          cargo test -p pasta_lua --target ${{ matrix.target }} --test ffi -- --show-output
        env:
          PASTA_TEST_LONG_PATHS_DISABLED: "1"

      # lint はターゲット非依存のため x64 のみで実行（x86 と二重に回さない）。
      - name: Clippy (-D warnings)
        if: matrix.arch == 'x64'
        run: cargo clippy --all-targets --workspace --target ${{ matrix.target }} -- -D warnings

      # 版 3 の 1 往復（shiori4-v3-portable 要件 9.6・10.3・1.5）。x64 のホストは x86 の DLL を読めないので x64 の行だけ。
      - name: Install shiori4-testhost
        if: matrix.arch == 'x64'
        run: cargo install shiori4_host --version 0.1.1 --example shiori4-testhost

      # パスは cygpath -w で作り末尾に \ を付ける（PowerShell の "…\" は末尾の \" が引用符の逃がしに読まれる）。
      # --entry なしの 1 回は、全部の口を許すホストでも版 3 に決まることを確かめる（1.5）。
      - name: SHIORI/4 v3 round trip
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          dll="$(cygpath -w "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/pasta.dll")"
          ghost="$(cygpath -w "$GITHUB_WORKSPACE/crates/pasta_sample_ghost/ghosts/hello-pasta/ghost/master")\\"
          shiori4-testhost --entry v3 "$dll" "$ghost"
          shiori4-testhost "$dll" "$ghost"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pasta-dll-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/pasta.dll
          retention-days: 7

  # Linux・macOS のビルドとテストと版 3 の 1 往復（shiori4-v3-portable 要件 9.1〜9.6・10.1〜10.5）。
  # 成果物は upload しない（配布は Windows だけ）。
  build-unix:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build pasta_shiori
        run: cargo build --release -p pasta_shiori

      - name: Run tests
        run: cargo test --workspace

      # lint はターゲット非依存のため Linux のみ。
      - name: Clippy (-D warnings)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Install shiori4-testhost
        run: cargo install shiori4_host --version 0.1.1 --example shiori4-testhost

      # ID を省くと OnBoot を送る。終了の状態が 0 でなければ失敗。
      - name: SHIORI/4 v3 round trip
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then ext=dylib; else ext=so; fi
          shiori4-testhost --entry v3 "$GITHUB_WORKSPACE/target/release/libpasta.$ext" "$GITHUB_WORKSPACE/crates/pasta_sample_ghost/ghosts/hello-pasta/ghost/master/"

  # 依存クレートの脆弱性勧告・ライセンス・取得元を deny.toml に照らして検査する。
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2

      # pasta-recipe の別の Cargo.lock を、アプリの deny.toml で検査する（pasta-recipe 要件 13.7）。
      # --config は check の前に置く（cargo-deny 0.20）。arguments を書くと既定の --all-features が外れるので書き足す。
      - name: cargo deny check (pasta-recipe)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: editors/recipe/src-tauri/Cargo.toml
          arguments: --all-features --config editors/recipe/src-tauri/deny.toml

  # pasta-recipe（editors/recipe・別のワークスペース）の型・テスト・ビルド（pasta-recipe 要件 13.1）。
  # ルートの検査は crates/* だけを見るので、アプリはここでだけ確かめる（13.2）。
  recipe:
    name: pasta-recipe
    runs-on: windows-latest
    defaults:
      run:
        working-directory: editors/recipe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: editors/recipe/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/recipe/package-lock.json

      - name: npm ci
        run: npm ci

      # node --test は型を外すだけで確かめないので、先に tsc で型を見る。
      - name: Type check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Clippy (-D warnings)
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      # ここから先はリリース CI と同じスクリプトで 2 つの zip を作って検査する（pasta-recipe-multiarch 要件 6.1・7.1〜7.4）。
      # 版はタグでなく editors/vscode/package.json から取る。公開も Release の作成もしない。
      - name: Install cargo-about
        working-directory: .
        run: pwsh -NoProfile -File .github/scripts/release/install-tools.ps1 -Name cargo-about

      # 引数なしで x64・arm64 の両方を作る（release/pasta-recipe.x64.zip・release/pasta-recipe.arm64.zip）。
      - name: Build pasta-recipe zips
        working-directory: .
        run: pwsh -NoProfile -File editors/recipe/scripts/package.ps1

      - name: Verify pasta-recipe zips
        working-directory: .
        run: |
          $version = (Get-Content -LiteralPath editors/vscode/package.json -Raw | ConvertFrom-Json).version
          pwsh -NoProfile -File .github/scripts/release/verify-recipe-zips.ps1 -Version $version -Dir release

      - name: Upload pasta-recipe zips
        uses: actions/upload-artifact@v7
        with:
          name: pasta-recipe-zips
          path: |
            release/pasta-recipe.x64.zip
            release/pasta-recipe.arm64.zip
          if-no-files-found: error

  # arm64 のランナーで pasta-recipe の Rust のテストを走らせる（pasta-recipe-multiarch 要件 6.4）。
  recipe-arm64-test:
    name: pasta-recipe (arm64 test)
    runs-on: windows-11-arm
    defaults:
      run:
        working-directory: editors/recipe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # targets を書かなければ host の aarch64-pc-windows-msvc だけになる。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: editors/recipe/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/recipe/package-lock.json

      - name: npm ci
        run: npm ci

      # generate_context! が dist/ を要る。
      - name: Frontend build
        run: npm run build

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  # job recipe が x64 のランナーで作った arm64 の exe を、arm64 のランナーで起動して落ちないことを見る（要件 6.5）。
  # 合格は「30 秒のうちに exe の子の msedgewebview2.exe が立ち、その時点で exe が生きている」（2026-11-14 設計議題 2）。
  recipe-arm64-smoke:
    name: pasta-recipe (arm64 smoke)
    needs: recipe
    runs-on: windows-11-arm
    steps:
      - name: Download pasta-recipe zips
        uses: actions/download-artifact@v8
        with:
          name: pasta-recipe-zips
          path: zips

      - name: Extract arm64 zip
        run: Expand-Archive -LiteralPath zips/pasta-recipe.arm64.zip -DestinationPath "$env:RUNNER_TEMP/recipe-arm64"

      - name: Smoke test (start exe and wait for WebView2)
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'recipe-arm64/pasta-recipe.exe'
          $p = Start-Process -FilePath $exe -PassThru
          $null = $p.Handle  # すぐ終わったときも ExitCode を読めるよう handle を先に開く
          $ok = $false
          try {
            for ($i = 1; $i -le 30; $i++) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) { Write-Error "pasta-recipe.exe exited after $i s (exit code $($p.ExitCode))"; break }
              if (Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe' AND ParentProcessId = $($p.Id)") {
                Write-Host "OK: msedgewebview2.exe started as a child of pasta-recipe.exe after $i s"
                $ok = $true; break
              }
            }
            if (-not $ok -and -not $p.HasExited) { Write-Error 'msedgewebview2.exe did not start within 30 s' }
          } finally {
            # 木ごと止める（WebView2 の子を残すとランナーが待つ）。
            if (-not $p.HasExited) { taskkill /T /F /PID $p.Id | Out-Null }
          }
          # taskkill の終了コードを step の結果にしない。
          if ($ok) { exit 0 } else { exit 1 }

  # VS Code 拡張（editors/vscode）の試験（grammar・unit・e2e。偽の vscode で Node だけで走る）。
  # 共有（editors/shared）へ移した後の取りこぼしを main で見つける（pasta-recipe-dev-actions 要件 13.3）。
  # wasm/ は wasm-pack で作る生成物なので作らず、本物の WASM を読む 3 本だけを外す（PASTA_VSCODE_NO_WASM）。
  vscode-test:
    name: vscode-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Extension tests
        run: npm test
        env:
          PASTA_VSCODE_NO_WASM: "1"

  # pasta_lua の Lua スクリプトを静的解析する。luacheck 本体は同梱版
  # （crates/pasta_lua/scriptlibs/luacheck, v1.2.0）を使い、依存の lfs / argparse のみ apt で入れる。
  luacheck:
    name: luacheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/pasta_lua
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Lua runtime deps
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua-filesystem lua-argparse

      - name: luacheck
        # `lua -` は標準入力をスクリプトとして実行し、後続引数を arg に渡す（luacheck の bin 相当）。
        run: echo 'require("luacheck.main")' | LUA_PATH="scriptlibs/?.lua;scriptlibs/?/init.lua;;" lua5.1 - pasta_scripts tests

  wasm:
    name: wasm-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown

      - name: Build pasta_lsp for WASM
        run: cargo build -p pasta_lsp --target wasm32-unknown-unknown --release

      - name: Check pasta_check library for WASM
        run: cargo check -p pasta_check --lib --no-default-features --target wasm32-unknown-unknown

      - name: Verify WASM artifact exists
        run: test -f target/wasm32-unknown-unknown/release/pasta_lsp.wasm

      - name: Check WASM artifact size (< 10MB)
        run: |
          size=$(stat -c%s target/wasm32-unknown-unknown/release/pasta_lsp.wasm)
          echo "WASM binary size: $size bytes ($(echo "scale=2; $size/1048576" | bc) MB)"
          if [ "$size" -gt 10485760 ]; then
            echo "ERROR: WASM artifact exceeds 10MB threshold"
            exit 1
          fi

  # リリースの補助スクリプト（.github/scripts/release/）を一時の git リポジトリで動かして確かめる。
  # ネットワークと gh を使わない。リリース CI の関門（gate）でもあるので、公開の前にも動く。
  release-scripts:
    name: release-scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Release scripts test
        run: pwsh -NoProfile -File .github/scripts/release/release-scripts-test.ps1

  # マニュアルの軽い検査（npm の依存なし・各 1 秒）。Rust を待たず、関門（gate）でも走る（ponytail-manual-ci 要件 1）。
  manual-light:
    name: manual-light-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Skill references freshness
        run: node book/tools/gen-skill-refs.mjs --check
      - name: Link check
        run: node book/tools/link-check.mjs
      - name: Tutorial artifact match check
        run: node book/tools/tutorial-check.mjs
