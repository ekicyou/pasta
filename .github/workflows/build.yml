# .github/workflows/build.yml
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # 手動実行

jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-pc-windows-msvc
            arch: x86
          - target: x86_64-pc-windows-msvc
            arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set Japanese locale for Shift-JIS support
        run: |
          Set-WinSystemLocale ja-JP
          Set-Culture ja-JP
        shell: powershell

      - name: Build pasta_shiori
        run: cargo build --release --target ${{ matrix.target }} -p pasta_shiori

      - name: Run tests
        run: cargo test --all

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pasta-dll-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/pasta.dll
          retention-days: 7

  wasm:
    name: wasm-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown

      - name: Build pasta_lsp for WASM
        run: cargo build -p pasta_lsp --target wasm32-unknown-unknown --release

      - name: Verify WASM artifact exists
        run: test -f target/wasm32-unknown-unknown/release/pasta_lsp.wasm

      - name: Check WASM artifact size (< 10MB)
        run: |
          size=$(stat -c%s target/wasm32-unknown-unknown/release/pasta_lsp.wasm)
          echo "WASM binary size: $size bytes ($(echo "scale=2; $size/1048576" | bc) MB)"
          if [ "$size" -gt 10485760 ]; then
            echo "ERROR: WASM artifact exceeds 10MB threshold"
            exit 1
          fi
