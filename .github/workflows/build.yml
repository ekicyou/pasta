# .github/workflows/build.yml
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # 手動実行
  workflow_call: {}  # release.yml の gate job から関門として呼ぶ（入力なし）

jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-pc-windows-msvc
            arch: x86
          - target: x86_64-pc-windows-msvc
            arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set Japanese locale for Shift-JIS support
        run: |
          Set-WinSystemLocale ja-JP
          Set-Culture ja-JP
        shell: powershell

      - name: Build pasta_shiori
        run: cargo build --release --target ${{ matrix.target }} -p pasta_shiori

      - name: Run tests
        run: cargo test --all --target ${{ matrix.target }}

      # 長いパスの設定（LongPathsEnabled）を切った機械で、深いパスの DLL と隣の依存 DLL が読めるかを確かめる
      # （lua-cmodule-robustness 要件 2.5）。ランナーは使い捨てなので元に戻さない。
      # テストは最初に接頭辞なしの長いパスが通らないことを確かめ、設定が効いていなければ失敗する。
      - name: Run FFI tests with LongPathsEnabled=0
        run: |
          Set-ItemProperty -Path HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 0
          cargo test -p pasta_lua --target ${{ matrix.target }} --test ffi -- --show-output
        env:
          PASTA_TEST_LONG_PATHS_DISABLED: "1"

      # lint はターゲット非依存のため x64 のみで実行（x86 と二重に回さない）。
      - name: Clippy (-D warnings)
        if: matrix.arch == 'x64'
        run: cargo clippy --all-targets --workspace --target ${{ matrix.target }} -- -D warnings

      # 版 3 の 1 往復（shiori4-v3-portable 要件 9.6・10.3・1.5）。x64 のホストは x86 の DLL を読めないので x64 の行だけ。
      - name: Install shiori4-testhost
        if: matrix.arch == 'x64'
        run: cargo install shiori4_host --version 0.1.0 --example shiori4-testhost

      # パスは cygpath -w で作り末尾に \ を付ける（PowerShell の "…\" は末尾の \" が引用符の逃がしに読まれる）。
      # --entry なしの 1 回は、全部の口を許すホストでも版 3 に決まることを確かめる（1.5）。
      - name: SHIORI/4 v3 round trip
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          dll="$(cygpath -w "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/pasta.dll")"
          ghost="$(cygpath -w "$GITHUB_WORKSPACE/crates/pasta_sample_ghost/ghosts/hello-pasta/ghost/master")\\"
          shiori4-testhost --entry v3 "$dll" "$ghost"
          shiori4-testhost "$dll" "$ghost"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pasta-dll-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/pasta.dll
          retention-days: 7

  # Linux・macOS のビルドとテストと版 3 の 1 往復（shiori4-v3-portable 要件 9.1〜9.6・10.1〜10.5）。
  # 成果物は upload しない（配布は Windows だけ）。
  build-unix:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build pasta_shiori
        run: cargo build --release -p pasta_shiori

      - name: Run tests
        run: cargo test --workspace

      # lint はターゲット非依存のため Linux のみ。
      - name: Clippy (-D warnings)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Install shiori4-testhost
        run: cargo install shiori4_host --version 0.1.0 --example shiori4-testhost

      # ID を省くと OnBoot を送る。終了の状態が 0 でなければ失敗。
      - name: SHIORI/4 v3 round trip
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then ext=dylib; else ext=so; fi
          shiori4-testhost --entry v3 "$GITHUB_WORKSPACE/target/release/libpasta.$ext" "$GITHUB_WORKSPACE/crates/pasta_sample_ghost/ghosts/hello-pasta/ghost/master/"

  # 依存クレートの脆弱性勧告・ライセンス・取得元を deny.toml に照らして検査する。
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2

  # pasta_lua の Lua スクリプトを静的解析する。luacheck 本体は同梱版
  # （crates/pasta_lua/scriptlibs/luacheck, v1.2.0）を使い、依存の lfs / argparse のみ apt で入れる。
  luacheck:
    name: luacheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/pasta_lua
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Lua runtime deps
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua-filesystem lua-argparse

      - name: luacheck
        # `lua -` は標準入力をスクリプトとして実行し、後続引数を arg に渡す（luacheck の bin 相当）。
        run: echo 'require("luacheck.main")' | LUA_PATH="scriptlibs/?.lua;scriptlibs/?/init.lua;;" lua5.1 - pasta_scripts tests

  wasm:
    name: wasm-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown

      - name: Build pasta_lsp for WASM
        run: cargo build -p pasta_lsp --target wasm32-unknown-unknown --release

      - name: Check pasta_check library for WASM
        run: cargo check -p pasta_check --lib --no-default-features --target wasm32-unknown-unknown

      - name: Verify WASM artifact exists
        run: test -f target/wasm32-unknown-unknown/release/pasta_lsp.wasm

      - name: Check WASM artifact size (< 10MB)
        run: |
          size=$(stat -c%s target/wasm32-unknown-unknown/release/pasta_lsp.wasm)
          echo "WASM binary size: $size bytes ($(echo "scale=2; $size/1048576" | bc) MB)"
          if [ "$size" -gt 10485760 ]; then
            echo "ERROR: WASM artifact exceeds 10MB threshold"
            exit 1
          fi

  # リリースの補助スクリプト（.github/scripts/release/）を一時の git リポジトリで動かして確かめる。
  # ネットワークと gh を使わない。リリース CI の関門（gate）でもあるので、公開の前にも動く。
  release-scripts:
    name: release-scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Release scripts test
        run: pwsh -NoProfile -File .github/scripts/release/release-scripts-test.ps1
