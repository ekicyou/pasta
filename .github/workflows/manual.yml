# .github/workflows/manual.yml
# 利用者マニュアル（mdBook）を GitHub Pages へ公開する。
# build.yml（Rust/WASM CI）とは独立。次の変更時のみ起動する:
#   book/**・本ワークフロー・スキル 3 種（pasta-ghost-authoring / pasta-lua-coding / pasta-check）、
#   クレート README（crates/*/README.md）・ルートの README.md・doc/SOUL.md（公開マニュアル URL の実在検査のため。
#   pasta-runtime-internals-doc 要件 7.8・manual-link-anchor-check 要件 4）、
#   hello-pasta の辞書（crates/pasta_sample_ghost/ghosts/hello-pasta/ghost/master/dic/**。チュートリアルの照合のため）、
#   pasta の TextMate 文法（editors/vscode/syntaxes/**。着色に使うため）、
#   リリース CI（.github/workflows/release.yml。link-check が最新版の固定リンクの名前を添付の名前と照らすため。
#   manual-download-page 要件 7.8）。
# PR とブランチでは検証（ビルド・検証スクリプト群）までを行い、Pages への公開は main のときだけ
# （main への push と main での手動実行。github-pages の environment が main だけに公開を許すため）。
# 権限はワークフロー全体を contents: read とし、pages: write・id-token: write は deploy ジョブにだけ与える。
#
# パイプライン（manual-ssot-authority design「CI と公開」/ 要件 7.1, 7.2, 7.5, 7.6, 8.2, 10.4、
# manual-claudia-theme 要件 8.7, 8.8）:
#   node book/tools/gen-skill-refs.mjs --check（スキル生成物の鮮度照合。不一致で中断）
#     -> mdbook build book -> 着色 -> 台詞部品の変換（talk-html）-> 日本語 bigram 索引を再生成
#     -> node book/tools/link-check.mjs（本の中のリンクと見出し（#…）・読者に届く文書（クレートの README・
#        ルートの README.md・doc/SOUL.md・スキル）の公開マニュアル URL・スキル自己完結の検証。失敗で中断）
#     -> チュートリアルの照合（入門の章 12 枚 ↔ hello-pasta の辞書。辞書の検査は build.yml の cargo test が受け持つ）
#     -> 静的性・検索（この 2 つは --self-test で検査ロジック自身の
#        自己テストも実行）・コンテンツ検証・ツール自己テスト
#     -> 旧版の生成（固定コミット CLASSIC_REF の book/ を旧版のツールで book/book/classic へ。印刷用のページは作らない。
#        新版の検査の後に置き、検査の対象に含めない。失敗で中断。manual-claudia-theme 要件 11）
#     -> Pages artifact（./book/book）をアップロード -> deploy-pages で公開。
# すべて build ジョブ内で検証するため、失敗時は deploy（needs: build）が走らず公開されない。
name: Manual

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/manual.yml'
      - '.github/workflows/release.yml'
      - '.claude/skills/pasta-ghost-authoring/**'
      - '.claude/skills/pasta-lua-coding/**'
      - '.claude/skills/pasta-check/**'
      - 'crates/*/README.md'
      - 'README.md'
      - 'doc/SOUL.md'
      - 'crates/pasta_sample_ghost/ghosts/hello-pasta/ghost/master/dic/**'
      - 'editors/vscode/syntaxes/**'
  pull_request:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/manual.yml'
      - '.github/workflows/release.yml'
      - '.claude/skills/pasta-ghost-authoring/**'
      - '.claude/skills/pasta-lua-coding/**'
      - '.claude/skills/pasta-check/**'
      - 'crates/*/README.md'
      - 'README.md'
      - 'doc/SOUL.md'
      - 'crates/pasta_sample_ghost/ghosts/hello-pasta/ghost/master/dic/**'
      - 'editors/vscode/syntaxes/**'
  workflow_dispatch:  # 手動実行

# Pages の同時デプロイを直列化（実行中のデプロイはキャンセルしない）。
# PR の検証は PR ごとに別グループとし、公開の直列化に巻き込まない。
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('manual-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

# 全体は読むだけ。公開の権限は deploy ジョブにだけ与える。
permissions:
  contents: read

jobs:
  build:
    name: build-manual
    runs-on: ubuntu-latest
    env:
      # 着せ替え前の版（classic/）を作る固定コミット（manual-claudia-theme 要件 11.1, 11.2）。定義はここ 1 か所。
      CLASSIC_REF: 6d4e868d799abb619f7db67611511f3196cd1ace
      # 新版と旧版の両方を作る mdBook の版。公式の配布物（rust-lang/mdBook の release）を取る。
      MDBOOK_VERSION: '0.5.4'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # スキル生成物（references/ の生成ファイル）がマニュアル章からの生成結果と一致するかを
      # 照合する（要件 7.1, 7.2）。生成器は npm 依存を持たないため npm ci より前に置き、
      # 依存インストールやビルドの前に速く失敗させる。不一致時は対象ファイルと再生成手順を報告。
      - name: Skill references freshness
        run: node book/tools/gen-skill-refs.mjs --check

      # build-time devDependency（vscode-textmate 等）を lockfile から厳密インストール。
      # npm ci＝決定論的インストール（要件 6.4）。working-directory は book（book/package.json）。
      - name: Install book build deps (npm ci)
        working-directory: book
        run: npm ci

      - name: Setup mdBook
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"

      - name: Build manual (mdBook)
        run: mdbook build book

      # mdbook build の直後に pasta コードブロックを TextMate 文法で着色する（要件 7.1）。
      # language-pasta ブロックに hljs 互換 span を焼き込む。bigram 索引（searchindex-*.js）
      # とはファイル非競合だが可読性のため bigram の前段に配置（要件 7.2）。
      # 失敗時 exit 1 でビルド中断＝公開前に止まる。出力先は book/book（mdBook 既定）。
      - name: Highlight pasta code blocks
        run: node book/tools/highlight/highlight-html.mjs book/book

      # 着色の直後・索引再生成の前に、台詞の引用（> 【タグ】…）を台詞部品の HTML へ変換する
      # （manual-claudia-theme 要件 8.7 / design「Pipeline」）。未知のタグ・入れ子の台詞は
      # 出力ファイルとタグを表示して exit 1＝公開前に止まる。出力先は book/book（mdBook 既定）。
      - name: Render talk components
        run: node book/tools/talk/talk-html.mjs book/book

      # mdbook build の後段で検索インデックスを日本語 bigram へ再生成する（要件 1.4）。
      # 失敗時 exit 1 でビルド中断。出力先は book/book（mdBook 既定）。
      - name: Rebuild bigram search index
        run: node book/tools/bigram-index/build-index.mjs book/book

      # 本の中のリンクと見出し・読者に届く文書の公開マニュアル URL・スキルの自己完結を検証し、
      # 問題があれば公開前に中断する（要件 8.2, 10.4・manual-link-anchor-check 要件 4）。
      # スクリプトはリポジトリルートを自己解決するため引数不要。
      - name: Link check
        run: node book/tools/link-check.mjs

      # チュートリアル成果物ガード その1（要件 6.2 / design「Content: Getting Started」）。
      # 入門の段の章 12 枚（book/src/getting-started/01-boot.md〜12-lua.md）の ```pasta ブロックを、
      # 同じ名前の辞書（crates/pasta_sample_ghost/ghosts/hello-pasta/ghost/master/dic/X.pasta ↔ X.md）と
      # 両方向に逐語照合する（辞書の全体が章にあること・章のブロックが辞書の全体か連続した抜き出しであること）。
      # 崩れていれば exit 1 で公開中断。スクリプトはリポジトリルートを自己解決するため引数不要。
      - name: Tutorial artifact match check
        run: node book/tools/tutorial-check.mjs

      # 出力の静的性・検索・コンテンツ受入基準の検証（ビルド済み book/book を対象に --no-build）。
      # verify-static / verify-search の --self-test は本検査を行ったうえで、検査ロジック自身の
      # 自己テストも実行する（manual-claudia-theme 要件 8.8）。
      - name: Verify static output
        run: node book/tools/verify-static.mjs --no-build --self-test

      - name: Verify search index
        run: node book/tools/verify-search.mjs --no-build --self-test

      - name: Verify content
        run: node book/tools/verify-content.mjs

      # book/tools 配下のツール自己テスト群。
      - name: Book tools self-tests
        shell: bash
        run: |
          set -e
          for t in $(find book/tools -name '*-test.mjs' -not -path '*/node_modules/*' | sort); do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done

      # 着せ替え前の版（旧版）を book/book/classic に生成する（manual-claudia-theme 要件 11 /
      # design「ClassicSnapshot」）。固定コミット CLASSIC_REF の book/ を、その版の lockfile の依存と
      # その版のツール（ビルド -> 着色 -> 索引再生成）でそのまま生成し、新版のツールは使わない（要件 11.2）。
      # 新版の検査はすべてこの段より前に終わるため、旧版は検査の対象に入らない（要件 11.3）。
      # PR でも実行して生成できることを確かめる。どの手順の失敗も exit 1 で公開を止める（要件 11.4）。
      # 印刷用のページ（print.html）は、生成のときの設定で作らせない（manual-print-page-removal 要件 2）。
      # 旧版の章の印刷では目次とメニューも刷られる。
      - name: Build classic manual snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$CLASSIC_REF"
          git worktree add --detach "$RUNNER_TEMP/classic" "$CLASSIC_REF"
          (cd "$RUNNER_TEMP/classic/book" && npm ci)
          out="$GITHUB_WORKSPACE/book/book/classic"
          MDBOOK_OUTPUT__HTML__PRINT__ENABLE=false mdbook build "$RUNNER_TEMP/classic/book" -d "$out"
          node "$RUNNER_TEMP/classic/book/tools/highlight/highlight-html.mjs" "$out"
          node "$RUNNER_TEMP/classic/book/tools/bigram-index/build-index.mjs" "$out"
          [ -f "$out/index.html" ] || { echo "::error::classic snapshot is missing index.html"; exit 1; }
          [ ! -e "$out/print.html" ] || { echo "::error::classic snapshot must not have print.html"; exit 1; }
          compgen -G "$out/searchindex*.js" > /dev/null || { echo "::error::classic snapshot is missing searchindex*.js"; exit 1; }

      # 公開は main のときだけ（ブランチの手動実行では検査だけ走らせて緑で終える）。
      # v4 から . で始まるファイルを既定で外すため、mdBook の .nojekyll を入れるよう指定する。
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./book/book
          include-hidden-files: true

  deploy:
    name: deploy-manual
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
