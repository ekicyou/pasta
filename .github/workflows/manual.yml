# .github/workflows/manual.yml
# 利用者マニュアル（mdBook）を GitHub Pages へ公開する。
# build.yml（Rust/WASM CI）とは独立。book/**・本ワークフロー・スキル 2 種
# （pasta-ghost-authoring / pasta-lua-coding）・クレート README（crates/*/README.md。
# マニュアル URL の実在検査のため。pasta-runtime-internals-doc 要件 7.8）の変更時のみ起動する。
# PR では検証（ビルド・検証スクリプト群）までを行い、Pages への公開は main push 時のみ。
#
# パイプライン（manual-ssot-authority design「CI と公開」/ 要件 7.1, 7.2, 7.5, 7.6, 8.2, 10.4、
# manual-claudia-theme 要件 8.7, 8.8）:
#   node book/tools/gen-skill-refs.mjs --check（スキル生成物の鮮度照合。不一致で中断）
#     -> mdbook build book -> 着色 -> 台詞部品の変換（talk-html）-> 日本語 bigram 索引を再生成
#     -> node book/tools/link-check.mjs（マニュアル内リンク・README のマニュアル URL・スキル自己完結の検証。失敗で中断）
#     -> チュートリアル・静的性・検索（静的性・検索の 2 つは --self-test で検査ロジック自身の自己テストも実行）
#        ・コンテンツ検証・ツール自己テスト
#     -> Pages artifact（./book/book）をアップロード -> deploy-pages で公開。
# すべて build ジョブ内で検証するため、失敗時は deploy（needs: build）が走らず公開されない。
name: Manual

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/manual.yml'
      - '.claude/skills/pasta-ghost-authoring/**'
      - '.claude/skills/pasta-lua-coding/**'
      - 'crates/*/README.md'
  pull_request:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/manual.yml'
      - '.claude/skills/pasta-ghost-authoring/**'
      - '.claude/skills/pasta-lua-coding/**'
      - 'crates/*/README.md'
  workflow_dispatch:  # 手動実行

# Pages の同時デプロイを直列化（実行中のデプロイはキャンセルしない）。
# PR の検証は PR ごとに別グループとし、公開の直列化に巻き込まない。
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('manual-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build-manual
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # スキル生成物（references/ の生成ファイル）がマニュアル章からの生成結果と一致するかを
      # 照合する（要件 7.1, 7.2）。生成器は npm 依存を持たないため npm ci より前に置き、
      # 依存インストールやビルドの前に速く失敗させる。不一致時は対象ファイルと再生成手順を報告。
      - name: Skill references freshness
        run: node book/tools/gen-skill-refs.mjs --check

      # build-time devDependency（vscode-textmate 等）を lockfile から厳密インストール。
      # npm ci＝決定論的インストール（要件 6.4）。working-directory は book（book/package.json）。
      - name: Install book build deps (npm ci)
        working-directory: book
        run: npm ci

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.3'

      - name: Build manual (mdBook)
        run: mdbook build book

      # mdbook build の直後に pasta コードブロックを TextMate 文法で着色する（要件 7.1）。
      # language-pasta ブロックに hljs 互換 span を焼き込む。bigram 索引（searchindex-*.js）
      # とはファイル非競合だが可読性のため bigram の前段に配置（要件 7.2）。
      # 失敗時 exit 1 でビルド中断＝公開前に止まる。出力先は book/book（mdBook 既定）。
      - name: Highlight pasta code blocks
        run: node book/tools/highlight/highlight-html.mjs book/book

      # 着色の直後・索引再生成の前に、台詞の引用（> 【タグ】…）を台詞部品の HTML へ変換する
      # （manual-claudia-theme 要件 8.7 / design「Pipeline」）。未知のタグ・入れ子の台詞は
      # 出力ファイルとタグを表示して exit 1＝公開前に止まる。出力先は book/book（mdBook 既定）。
      - name: Render talk components
        run: node book/tools/talk/talk-html.mjs book/book

      # mdbook build の後段で検索インデックスを日本語 bigram へ再生成する（要件 1.4）。
      # 失敗時 exit 1 でビルド中断。出力先は book/book（mdBook 既定）。
      - name: Rebuild bigram search index
        run: node book/tools/bigram-index/build-index.mjs book/book

      # マニュアル内リンク切れ・スキルの自己完結（実在ファイルへのリンクのみ）を検証し、
      # 問題があれば公開前に中断する（要件 8.2, 10.4）。
      # スクリプトはリポジトリルートを自己解決するため引数不要。
      - name: Link check
        run: node book/tools/link-check.mjs

      # チュートリアル成果物ガード その1（要件 6.2 / design「Content: Getting Started」）。
      # book/src/getting-started/first-ghost.md の ```pasta 成果物ブロックが、
      # 起動可能な最小セット一式 hello-pasta（SSOT: crates/pasta_sample_ghost/ghosts/
      # hello-pasta/ghost/master/dic/*.pasta）と逐語一致するかを検証する。崩れていれば
      # exit 1 で公開中断。スクリプトはリポジトリルートを自己解決するため引数不要。
      - name: Tutorial artifact match check
        run: node book/tools/tutorial-check.mjs

      # Rust ツールチェーン（その2の構文検証＝cargo test 用）。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # チュートリアル成果物ガード その2（要件 6.2 / design「Testing/コンテンツ整合」）。
      # pasta_check CLI に .pasta 構文検証サブコマンドは無い（release のみ）ため、
      # hello-pasta 実ファイルを本物の PastaLoader::load で読み込み・トランスパイルして
      # 検証する既存テスト（self_deploy_integration_test.rs 等）を構文検証手段として採用。
      # その1で「チュートリアル == 実ファイル」を保証済みのため、チュートリアル成果物の
      # 構文妥当性が transitively 担保される（フル SSP 実行なしの機械的ガード）。
      - name: Tutorial syntax validation (hello-pasta real files)
        run: cargo test -p pasta_sample_ghost

      # 出力の静的性・検索・コンテンツ受入基準の検証（ビルド済み book/book を対象に --no-build）。
      # verify-static / verify-search の --self-test は本検査を行ったうえで、検査ロジック自身の
      # 自己テストも実行する（manual-claudia-theme 要件 8.8）。
      - name: Verify static output
        run: node book/tools/verify-static.mjs --no-build --self-test

      - name: Verify search index
        run: node book/tools/verify-search.mjs --no-build --self-test

      - name: Verify content
        run: node book/tools/verify-content.mjs

      # book/tools 配下のツール自己テスト群。
      - name: Book tools self-tests
        shell: bash
        run: |
          set -e
          for t in $(find book/tools -name '*-test.mjs' -not -path '*/node_modules/*' | sort); do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done

      # enablement: true — リポジトリで Pages が未設定でも API 経由で
      # 自動有効化を試みる（Source=GitHub Actions）。初回公開を手動設定なしで通す。
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book/book

  deploy:
    name: deploy-manual
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
