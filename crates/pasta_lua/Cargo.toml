[package]
name = "pasta_lua"
workspace = "../.."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = true
description = "Pasta Lua - Lua integration for Pasta DSL"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[features]
# lua-debug-poc: VSCode Lua デバッグ実現可能性の検証ハーネス（テスト専用）。
# default には含めず、`cargo test --features lua-debug-poc` でのみ有効化する。
# 既定（リリース）ビルド・既存テストには一切影響しない（Requirement 5.1）。
lua-debug-poc = []

[dependencies]
pasta_core.workspace = true
pasta_dsl.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
mlua.workspace = true
mlua-stdlib.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
glob.workspace = true
flate2.workspace = true
regex.workspace = true
budoux.workspace = true
unicode-width.workspace = true
zip.workspace = true

[build-dependencies]
zip.workspace = true
md5.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true
tracing-test.workspace = true
md5.workspace = true
