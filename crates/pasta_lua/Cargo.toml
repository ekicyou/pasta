[package]
name = "pasta_lua"
workspace = "../.."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = true
description = "Pasta Lua - Lua integration for Pasta DSL"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true

[dependencies]
pasta_core.workspace = true
pasta_dsl.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
mlua.workspace = true
mlua-stdlib.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
glob.workspace = true
flate2.workspace = true
regex.workspace = true
budouy.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
socket2.workspace = true
zip.workspace = true

[build-dependencies]
zip.workspace = true
md5.workspace = true

[target.'cfg(windows)'.dependencies]
# ffi.load の置き換え（runtime/ffi_load）: LoadLibraryExW・GetModuleHandleW・FreeLibrary・FormatMessageW
windows-sys = { workspace = true, features = ["Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true
tracing-test.workspace = true
md5.workspace = true
ctor = "0.2"
# FFI のテスト用 DLL を、テストの中で対象のアーキテクチャの cl.exe で作る（tests/ffi/dll_fixture.rs）
cc = "1"

[target.'cfg(windows)'.dev-dependencies]
# GetShortPathNameW（8.3 名）・GetFileAttributesW と RegGetValueW（長いパスの設定が無効な前提の確かめ）
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_Registry"] }
