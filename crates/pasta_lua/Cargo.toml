[package]
name = "pasta_lua"
workspace = "../.."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = true
description = "Pasta Lua - Lua integration for Pasta DSL"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[features]
# 使い捨て検証ハーネス（PoC）。default 無効。有効時のみ actor_poc モジュールと
# wintf-winmsg-executor がコンパイル対象になる（無効時はバイト不変）。
actor-poc = ["dep:wintf-winmsg-executor"]

[dependencies]
pasta_core.workspace = true
pasta_dsl.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
mlua.workspace = true
mlua-stdlib.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
glob.workspace = true
flate2.workspace = true
regex.workspace = true
budouy.workspace = true
unicode-width.workspace = true
socket2.workspace = true
zip.workspace = true
# actor-poc feature 有効時のみリンクする使い捨て PoC 用 executor（公開フォーク）
wintf-winmsg-executor = { version = "0.0.3", optional = true }

[build-dependencies]
zip.workspace = true
md5.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true
tracing-test.workspace = true
md5.workspace = true
ctor = "0.2"
