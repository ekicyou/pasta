[package]
name = "pasta_lua"
workspace = "../.."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = true
description = "Pasta Lua - Lua integration for Pasta DSL"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[features]
# pasta-source-map-slice: `.pasta`↔生成 `.lua` 行対応の薄い実証スライス（R4.4/R4.5）。
# default には含めず、`cargo test --features pasta-source-map-slice` でのみ有効化する。
# 無効時（既定）はスライスのコード・テスト経路を一切コンパイル/露出せず、本番動作へ
# ゼロコスト（R4.6）。本番品質のソースマップ実装は別仕様 `pasta-source-map` の担当。
pasta-source-map-slice = []

[dependencies]
pasta_core.workspace = true
pasta_dsl.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
mlua.workspace = true
mlua-stdlib.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
glob.workspace = true
flate2.workspace = true
regex.workspace = true
budoux.workspace = true
unicode-width.workspace = true
zip.workspace = true

[build-dependencies]
zip.workspace = true
md5.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true
tracing-test.workspace = true
md5.workspace = true
