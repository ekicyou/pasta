[package]
name = "pasta_lua"
workspace = "../.."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = true
description = "Pasta Lua - Lua integration for Pasta DSL"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[features]
# 使い捨て検証ハーネス（PoC）。default 無効。有効時のみ actor_poc モジュールと
# wintf-winmsg-executor がコンパイル対象になる（無効時はバイト不変）。
#
# `windows-sys/Win32_System_Threading` は task 2.2（ReloadProbe）の実ハンドル計測
# （`GetProcessHandleCount` / `GetGuiResources`）にのみ必要。cargo の feature 加算は
# ビルド単位ごとなので、actor-poc 無効（既定）のリリースビルドではこの windows-sys
# feature は有効化されず、出荷成果物はバイト不変のまま（R7.2）。
actor-poc = ["dep:wintf-winmsg-executor", "windows-sys/Win32_System_Threading"]

[dependencies]
pasta_core.workspace = true
pasta_dsl.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
mlua.workspace = true
mlua-stdlib.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
glob.workspace = true
flate2.workspace = true
regex.workspace = true
budouy.workspace = true
unicode-width.workspace = true
socket2.workspace = true
zip.workspace = true
# actor-poc feature 有効時のみリンクする使い捨て PoC 用 executor（公開フォーク）
wintf-winmsg-executor = { workspace = true, optional = true }

[build-dependencies]
zip.workspace = true
md5.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true
tracing-test.workspace = true
md5.workspace = true
ctor = "0.2"
