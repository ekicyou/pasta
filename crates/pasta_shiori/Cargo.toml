[package]
name = "pasta_shiori"
workspace = "../.."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SHIORI DLL interface for pasta script engine"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lib]
name = "pasta"
crate-type = ["cdylib", "rlib"]

[features]
# 使い捨て検証ハーネス（PoC）。default 無効。pasta_lua/actor-poc へ伝播する。
actor-poc = ["pasta_lua/actor-poc"]

[dependencies]
pasta_lua.workspace = true
time.workspace = true
tracing.workspace = true
thiserror.workspace = true
pest.workspace = true
pest_derive.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
# テスト前に ambient な PASTA_DEBUG を中和するための before-main フック
ctor = "0.2"
