[package]
name = "pasta_shiori"
workspace = "../.."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SHIORI DLL interface for pasta script engine"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true

[lib]
name = "pasta"
crate-type = ["cdylib", "rlib"]

[dependencies]
pasta_lua.workspace = true
time.workspace = true
tracing.workspace = true
thiserror.workspace = true
pest.workspace = true
pest_derive.workspace = true
# mailbox=同期 recv()（アクタースレッドのループ）／reply・done=recv_timeout（本番アクター経路で使用）
flume.workspace = true
# 旧来の入口の置き場（static LEGACY）の lock-free 再設定可能スロット（RN6: respawn モデル）。reload で
# アクタースレッド＋チャネルを teardown→再 spawn するため、送信端 Sender を Mutex なしで
# 差し替え可能にする ArcSwapOption を用いる（送信パスは load/store のみ・lock-free）。
arc-swap.workspace = true
# 版 3 の口（`shiori_get_api`）。ABI の検査（copy_from_slice・UTF-8・パニックの捕捉）はこのクレートが行う。
shiori4_abi.workspace = true

[target.'cfg(windows)'.dependencies]
# teardown のリーク検査（GetProcessHandleCount/GetGuiResources）に Win32_System_Threading を
# 追加する。ベースの windows-sys（Foundation/Memory/Globalization）は workspace から継承。
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[build-dependencies]
# pasta.dll のプロパティ「詳細」にファイル/製品バージョンを出す VERSIONINFO と、アイコン（res/pasta.ico）を埋め込む。
# 非 Windows ターゲットでは何もしない。
embed-resource.workspace = true

[dev-dependencies]
tempfile.workspace = true
# テスト前に ambient な PASTA_DEBUG を中和するための before-main フック
ctor = "1.0"
# 作者デバッグ保全 E2E（task 6.1）の最小 DAP-over-TCP クライアントが DAP フレームを
# 組み立て・解析するために使用する。
serde_json.workspace = true
# 観測ログ点（task 6.2）の検証: `#[traced_test]` でテストローカルに subscriber を装着し、
# アクター/marshaling/teardown シームの tracing イベント発火を `logs_contain` で観測する。
tracing-test.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# 機能レベル統合 E2E（task 7.1）が、出荷 extern FFI 入口（`load`）へ渡す ghost ディレクトリを
# 本番 `to_ansi_str`（CP_ACP デコード）と対称な `WideCharToMultiByte`/CP_ACP で ANSI エンコードし、
# 応答 HGLOBAL を read/free するために Win32 Memory/Globalization を直接利用する。
# 本体は既に windows-sys を通常依存として持つため、dev 側はリンク可能化のための再宣言のみ。
windows-sys = { workspace = true }
