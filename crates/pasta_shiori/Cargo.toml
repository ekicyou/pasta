[package]
name = "pasta_shiori"
workspace = "../.."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SHIORI DLL interface for pasta script engine"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lib]
name = "pasta"
crate-type = ["cdylib", "rlib"]

[features]
# アクターランタイム用ハーネス。default 無効。pasta_lua/actor-poc へ伝播しつつ、
# 本番アクタースレッド（task 3.x）を所有する pasta_shiori 側で executor を直接
# 使えるようにするため `wintf-winmsg-executor` を本クレートの optional 依存へ
# 昇格する（R4.4: アクタースレッド所有・executor 選択をアダプタ層に閉じ込める）。
# wintf は本 feature 有効時のみリンクされるため、default 無効のリリースビルドは
# 引き続きバイト不変（R7.2）。flume は feature 非依存だが未使用のため
# 出荷応答バイトには影響しない。
actor-poc = ["pasta_lua/actor-poc", "dep:wintf-winmsg-executor"]

[dependencies]
pasta_lua.workspace = true
time.workspace = true
tracing.workspace = true
thiserror.workspace = true
pest.workspace = true
pest_derive.workspace = true
# mailbox=recv_async／reply・done=recv_timeout（task 3.x で使用）
flume.workspace = true
# 本番アクタースレッドの block_on メッセージループ（actor-poc 有効時のみリンク）
wintf-winmsg-executor = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
# テスト前に ambient な PASTA_DEBUG を中和するための before-main フック
ctor = "0.2"
