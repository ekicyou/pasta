[package]
name = "pasta_shiori"
workspace = "../.."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SHIORI DLL interface for pasta script engine"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lib]
name = "pasta"
crate-type = ["cdylib", "rlib"]

[features]
# 使い捨て PoC ハーネス（pasta-actor-feasibility）の残骸。default 無効。
# task 5.1 で本番アクタースレッドが出荷経路へ昇格したため、wintf は本 feature ではなく
# 通常依存（下記参照）になった。本 feature は actor_poc/ モジュール（task 7.2 で撤去予定）
# と pasta_lua/actor-poc 伝播のためにのみ残す。
actor-poc = ["pasta_lua/actor-poc"]

[dependencies]
pasta_lua.workspace = true
time.workspace = true
tracing.workspace = true
thiserror.workspace = true
pest.workspace = true
pest_derive.workspace = true
# mailbox=recv_async／reply・done=recv_timeout（本番アクター経路で使用）
flume.workspace = true
# 本番アクタースレッドの block_on メッセージループ。task 5.1 で FFI 入口が本スレッドへ
# 切り替わったため、optional/actor-poc から通常依存へ昇格（R4.4: アクタースレッド所有を
# アダプタ層に閉じ込める）。リリースは default 無効の actor_poc 由来コードを含まないが
# wintf 自体は出荷経路がリンクする。
wintf-winmsg-executor.workspace = true
# static MAILBOX の lock-free 再設定可能スロット（RN6: respawn モデル）。reload で
# アクタースレッド＋チャネルを teardown→再 spawn するため、送信端 Sender を Mutex なしで
# 差し替え可能にする ArcSwapOption を用いる（送信パスは load/store のみ・lock-free）。
arc-swap.workspace = true

[target.'cfg(windows)'.dependencies]
# teardown のリーク検査（GetProcessHandleCount/GetGuiResources）に Win32_System_Threading を
# 追加する。ベースの windows-sys（Foundation/Memory/Globalization）は workspace から継承。
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
# テスト前に ambient な PASTA_DEBUG を中和するための before-main フック
ctor = "0.2"
# 作者デバッグ保全 E2E（task 6.1）の最小 DAP-over-TCP クライアントが DAP フレームを
# 組み立て・解析するために使用する。
serde_json.workspace = true
# 観測ログ点（task 6.2）の検証: `#[traced_test]` でテストローカルに subscriber を装着し、
# アクター/marshaling/teardown シームの tracing イベント発火を `logs_contain` で観測する。
tracing-test.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# 機能レベル統合 E2E（task 7.1）が、出荷 extern FFI 入口（`load`）へ渡す ghost ディレクトリを
# 本番 `to_ansi_str`（CP_ACP デコード）と対称な `WideCharToMultiByte`/CP_ACP で ANSI エンコードし、
# 応答 HGLOBAL を read/free するために Win32 Memory/Globalization を直接利用する。
# 本体は既に windows-sys を通常依存として持つため、dev 側はリンク可能化のための再宣言のみ。
windows-sys = { workspace = true }
