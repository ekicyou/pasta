# call_execution_correctness E2E 用フィクスチャ（call-execution-correctness requirements 8.1–8.3）
#
# ウェイト設定は置かない（発言には既定のウェイトがそのままかかる。失敗表記は raw_script なので
# 既定のウェイトがかかる文字（「var.」の「.」など）を含んでも \_w[…] は入らない）。

[loader]
pasta_patterns = ["dic/*.pasta"]
transpiled_output_dir = "profile/pasta/cache/lua"

# チェイントークの残りを出す OnTalk の機会を決定論化するため、トーク間隔を固定する
# （OnSecondChange に X-Pasta-Time を載せて 10 秒進める。手本は fixtures/actor_proxy_act_delegation）。
[ghost]
talk_interval_min = 10
talk_interval_max = 10

# アクターを登録して、未設定の警告や立ち位置フォールバックの警告をログに混ぜない
# （ログの警告の文言・件数を確かめるテストのため）。
[actor."さくら"]
spot = 0
