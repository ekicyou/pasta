[package]
name = "pasta_sample_ghost"
workspace = "../.."
version.workspace = true
description = "Sample ghost implementation for pasta - hello-pasta"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

# メインバイナリ：ゴースト配布物生成ツール
[[bin]]
name = "pasta_sample_ghost"
path = "src/main.rs"

[dependencies]
# 画像生成
image.workspace = true
imageproc.workspace = true

# エラー処理
thiserror.workspace = true

[dev-dependencies]
# テスト用一時ディレクトリ
tempfile.workspace = true
# 統合テスト: 実ローダーを駆動して自己展開（self-deploy）を検証する
pasta_lua.workspace = true
# 統合テスト: tracing ログ捕捉（自己展開失敗時の ERROR ログ検証）
# tracing は tracing-test の #[traced_test] マクロ展開が直接参照するため必須
tracing.workspace = true
tracing-test.workspace = true

