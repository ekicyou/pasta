[package]
name = "pasta_sample_ghost"
workspace = "../.."
version.workspace = true
description = "Sample ghost implementation for pasta - hello-pasta"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[dev-dependencies]
# 素材の検証: PNG の寸法・色型・画素を読む
png = "0.18"
# テスト用一時ディレクトリ
tempfile.workspace = true
# 統合テスト: 実ローダーを駆動して自己展開（self-deploy）を検証する
pasta_lua.workspace = true
# 統合テスト: tracing ログ捕捉（自己展開失敗時の ERROR ログ検証）
# tracing は tracing-test の #[traced_test] マクロ展開が直接参照するため必須
tracing.workspace = true
tracing-test.workspace = true
# 統合テスト: テスト前に ambient な PASTA_DEBUG を中和するための before-main フック
ctor = "0.2"

