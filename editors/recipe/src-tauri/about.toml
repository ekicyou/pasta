# cargo-about 設定: pasta-recipe.exe のネイティブの部品の第三者ライセンス表示を生成する。
# 受け入れの並びはルートの about.toml と同じものに、このアプリの依存に実際に出たものだけを足す（ルートは変えない）。
# 許可ライセンスは deny.toml の [licenses].allow と揃えること。
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    # このアプリの依存に出たもの（cssparser・selectors・option-ext など＝MPL-2.0、notify＝CC0-1.0）
    "MPL-2.0",
    "CC0-1.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
