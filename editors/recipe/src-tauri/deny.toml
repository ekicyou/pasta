# cargo-deny 設定: pasta-recipe の別の Cargo.lock 用（ルートの deny.toml は変えない）。
# [licenses].allow は about.toml の accepted と揃えること。勧告・取得元の設定はルートと同じ。
[graph]
targets = ["x86_64-pc-windows-msvc"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    # このアプリの依存に出たもの（cssparser・selectors・option-ext など＝MPL-2.0、notify＝CC0-1.0）
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
yanked = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
