# Pasta Workspace Root - Script engine for areka desktop mascot application
# This file defines the workspace structure; individual packages are in crates/

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.4"
edition = "2024"
authors = ["Dot-Station Master <dot.station@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ekicyou/pasta"
homepage = "https://github.com/ekicyou/pasta"
documentation = "https://github.com/ekicyou/pasta"

[workspace.dependencies]
# pasta_core dependencies
pest = "2.8.6"
pest_derive = { version = "2.8.6", features = ["grammar-extras"] }
thiserror = "2"
fast_radix_trie = "1.2.0"
rand = "0.10"
tracing = "0.1"

# Development dependencies
tempfile = "3"
insta = { version = "1.47.2", features = ["glob"] }
tracing-test = { version = "0.2", features = ["no-env-filter"] }

# pasta_lua dependencies
mlua = { version = "0.11", features = ["luajit52", "vendored", "serialize"] }
mlua-stdlib = { version = "0.1", features = ["json", "regex", "yaml"] }
regex = "1.12.3"
toml = "1.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
flate2 = "1.1.9"
budouy = { version = "0.2.2", features = ["vendored-models"] }
unicode-width = "0.2.2"
socket2 = "0.5"

# pasta_check dependencies
lexopt = "0.3"
md5 = "0.8"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

# pasta_lsp dependencies
tower-lsp = { version = "0.20", default-features = false, features = ["runtime-agnostic"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

# pasta_sample_ghost dependencies
image = "0.25"
imageproc = "0.26"

# Time dependencies
time = { version = "0.3", features = ["local-offset", "parsing"] }

# Windows API dependencies
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Globalization"] }

# Logging dependencies
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Internal dependencies
pasta_core = { path = "crates/pasta_core", version = "0.2.4" }
pasta_dsl = { path = "crates/pasta_dsl", version = "0.2.4" }
pasta_lua = { path = "crates/pasta_lua", version = "0.2.4" }
pasta_shiori = { path = "crates/pasta_shiori", version = "0.2.4" }
pasta_check = { path = "crates/pasta_check", version = "0.2.4" }

# Release profile optimizations for size reduction
[profile.release]
opt-level = "z"       # Optimize for size (最小サイズ)
lto = true            # Link-Time Optimization (全体最適化)
codegen-units = 1     # 並列コード生成を無効化して最適化向上
panic = "abort"       # パニック時にアンワインド不要（サイズ削減）
strip = true          # デバッグシンボルを削除
