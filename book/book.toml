[book]
title = "pasta マニュアル"
description = "ゴースト作者向けの Pasta DSL 文法・Lua API・入門チュートリアルと、コントリビュータ向けのランタイム内部設計をまとめた pasta のマニュアル"
authors = ["pasta project"]
language = "ja"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
# サブパス公開（GitHub Pages: https://<user>.github.io/pasta/）。
# 相対リンク出力は mdBook 既定のまま維持し、file:// オフライン閲覧と両立させる。
site-url = "/pasta/"
git-repository-url = "https://github.com/ekicyou/pasta"
# Claudia テーマ（manual-claudia-theme）。全章と print.html に読み込まれる。
additional-css = ["theme/claudia.css"]
additional-js = ["theme/claudia.js"]

[output.html.redirect]
"/lua/modules.html" = "modules/index.html"
"/getting-started/first-ghost.html" = "index.html"

[output.html.search]
enable = true

[output.html.fold]
enable = true
level = 0
