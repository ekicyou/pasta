# manual-sources.toml — ドリフト追跡マッピングの正準ファイル
#
# 役割（Requirement 10.1 / Design「Drift Detection & Gate」）:
#   各マニュアル文法章（book/src/grammar/*.md）が「どの doc/spec 章・節に由来するか」
#   の対応関係と、参照時点のコンテンツハッシュ（版マーカー）を機械可読な形で記録する
#   正準ファイル。drift-check（タスク 4.1, book/tools/drift-check.mjs）がこの記録を
#   読み込み、各エントリの `hash`（記録値）と `source` 現状ファイルのハッシュを比較する。
#
# 検出の仕組み（マーカー方式・git 非依存）:
#   - 記録ハッシュ == doc/spec 現値ハッシュ  → 由来は不変。章は追従済みとみなす。
#   - 記録ハッシュ != doc/spec 現値ハッシュ  → 由来が変わったのに章が未追従＝ドリフト。
#     drift-check は警告または失敗（完了ゲート文脈では非ゼロ終了で完了中断）を返す。
#   git の分岐点・diff base に依存せず、CI でも完了ゲートでも同一に動作する。
#
# ハッシュ方式:
#   algorithm = "sha256"。対象は doc/spec ファイルの **生バイト列全体**（正規化なし）。
#   再現方法（どちらも下記の値と一致する）:
#     sha256sum doc/spec/<file>.md
#     node -e "const f=require('fs'),c=require('crypto');console.log(c.createHash('sha256').update(f.readFileSync('doc/spec/<file>.md')).digest('hex'))"
#
# 運用注記（版マーカーの更新規律）:
#   この `hash` 値は「該当 doc/spec 章を参照してマニュアル章を追従させた時点の版」を表す。
#   doc/spec が更新されてドリフトが検出されたら、開発者はまずマニュアル章を追従更新し、
#   **そのうえで** ここの `hash` を doc/spec の現値へ更新する。
#   ＝ hash の更新は「マニュアル章をレビュー済みで整合した」という明示的な承認マーカーで
#   あり、doc/spec 変更時に機械的・無条件に書き換えてはならない。これによりゲートを通過する。
#
# 網羅範囲:
#   doc/spec の実装済み章（ch01–07, 09–11）に対応する全文法章を登録する。
#   ch08（属性=未実装）・ch12（future=将来仕様）は網羅対象外ゆえマッピングに含めない
#   （Requirement 4.6 / Design）。

algorithm = "sha256"

